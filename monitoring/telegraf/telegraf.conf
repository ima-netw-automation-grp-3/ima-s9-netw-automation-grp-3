# Telegraf du lab SONiC : collecte du lab (lab_collector), conteneurs (Docker), hôte, auto-surveillance.
# Les ${VARIABLES} sont fournies par docker-compose.yml (valeurs par défaut ou fichier .env).

[global_tags]
  lab = "${LAB_NAME}"

[agent]
  interval = "${TELEGRAF_INTERVAL}"
  round_interval = true
  metric_batch_size = 5000
  metric_buffer_limit = 100000
  collection_jitter = "0s"
  flush_interval = "${TELEGRAF_INTERVAL}"
  flush_jitter = "0s"
  omit_hostname = true
  skip_processors_after_aggregators = true

###############################################################################
# Sortie : InfluxDB 2.x (bucket du lab)
###############################################################################
[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

###############################################################################
# Collecteur du lab : découvre les nœuds containerlab (label containerlab=<lab> et fichier de
# topologie), exécute un collecteur dans chacun par docker exec et mesure la latence entre nœuds.
# Telegraf envoie une ligne sur stdin à chaque intervalle ; le script répond en line protocol.
# Il reçoit aussi les flux sFlow des routeurs (UDP SFLOW_PORT sur SFLOW_BIND, l'IP du conteneur sur le
# réseau de management) et les agrège à chaque cycle (lab_flow, lab_flow_agent).
###############################################################################
[[inputs.execd]]
  command = ["python3", "/opt/lab-collector/lab_collector.py", "serve"]
  signal = "STDIN"
  restart_delay = "10s"
  data_format = "influx"

# Écritures ponctuelles du collecteur (make iperf, make traffic). Écoute dans le conteneur seulement :
# le conteneur est aussi sur le réseau de management du lab, partagé avec les jobs CI, où seule
# l'écoute sFlow du collecteur doit être joignable. Gardez 127.0.0.1 pour tout autre listener.
[[inputs.influxdb_v2_listener]]
  service_address = "127.0.0.1:8186"
  use_internal_statistics = true

###############################################################################
# Conteneurs du lab et de la stack : CPU, mémoire, réseau, disque, état, santé
###############################################################################
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  container_name_include = ["clab-${LAB_NAME}-*", "${COMPOSE_PROJECT}-*"]
  # totaux par conteneur seulement : le détail par cœur et par interface multiplierait les séries
  # (un routeur SONiC a une quarantaine d'interfaces, déjà relevées par le collecteur du lab)
  perdevice_include = []
  total_include = ["cpu", "blkio", "network"]
  docker_label_include = ["clab-node-name", "clab-node-kind", "com.docker.compose.service"]
  timeout = "5s"

# Labels Docker -> tags homogènes avec le collecteur (node, kind) et compose (service)
[[processors.rename]]
  namepass = ["docker*"]
  [[processors.rename.replace]]
    tag = "clab-node-name"
    dest = "node"
  [[processors.rename.replace]]
    tag = "clab-node-kind"
    dest = "kind"
  [[processors.rename.replace]]
    tag = "com.docker.compose.service"
    dest = "service"

###############################################################################
# Hôte du lab (système de fichiers de l'hôte monté sur /hostfs, voir HOST_* dans compose)
###############################################################################
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  report_active = true

[[inputs.mem]]

[[inputs.system]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs", "nsfs", "efivarfs", "ramfs", "autofs", "fuse.portal", "fuse.gvfsd-fuse"]

###############################################################################
# Auto-surveillance de Telegraf (métriques collectées, écrites, erreurs, tampon)
###############################################################################
[[inputs.internal]]
  collect_memstats = true
