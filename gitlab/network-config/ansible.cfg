# Configuration Ansible du projet. Les jobs CI la désignent par ANSIBLE_CONFIG : Ansible ignore un
# ansible.cfg situé dans un dossier accessible en écriture à tous, ce qu'est le dossier des jobs.
[defaults]
inventory = inventory/hosts.yml
collections_path = collections
roles_path = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
forks = 10
callback_result_format = yaml
display_skipped_hosts = False
